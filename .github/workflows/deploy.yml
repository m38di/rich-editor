# One-push deploy to GitHub Pages.
#
# Setup (once):
#   1. Push this folder as the ROOT of a GitHub repo
#      (so this file lands at .github/workflows/deploy.yml in the repo).
#   2. Repo → Settings → Pages → "Build and deployment" → Source: GitHub Actions.
#
# After that, every push to main builds the Vite app and publishes it to
# https://<user>.github.io/<repo>/  — free, with HTTPS.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
