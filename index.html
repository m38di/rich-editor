<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Cpath d='M30 70l6-22 30-30a6 6 0 0 1 8.5 0l7.5 7.5a6 6 0 0 1 0 8.5l-30 30-22 6z' fill='white'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="A modern block-based article editor for the web. Format with a floating toolbar, slash commands and Markdown shortcuts, then generate, preview and download clean semantic HTML."
    />
    <title>Rich Editor · modern article editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint so there is no flash.
      ;(function () {
        try {
          var saved = localStorage.getItem('re-theme')
          var dark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#0b0e14')
          }
        } catch (e) {}
      })()
    </script>

    <style>
      /* Boot backdrop — replaced the moment the app mounts. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f5f8;
      }
      html.dark,
      html.dark body {
        background: #0b0e14;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
